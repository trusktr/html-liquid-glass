<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Liquid Glass Hero</title>
    <style>
        :root {
            color-scheme: light;
            --page-bg: #e9edf3;
            --page-ink: #182230;
            --scene-border: rgba(20, 29, 43, 0.16);
            --scene-shadow: 0 28px 80px rgba(26, 31, 43, 0.12);
            --glass-fill: rgba(255, 255, 255, 0.58);
            --glass-stroke: rgba(255, 255, 255, 0.82);
            --scene-w: min(676px, calc(100vw - 32px));
            --scene-h: clamp(540px, 76vh, 640px);
            --label-size: 11px;
            --ui-ink: rgba(20, 28, 38, 0.82);
            --ui-muted: rgba(20, 28, 38, 0.62);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background:
                radial-gradient(circle at top left, rgba(255, 255, 255, 0.86), transparent 38%),
                radial-gradient(circle at right 12%, rgba(197, 214, 235, 0.64), transparent 30%),
                linear-gradient(180deg, #f6f8fb 0%, var(--page-bg) 100%);
            color: var(--page-ink);
            font-family: "SF Pro Display", "Helvetica Neue", "Arial Nova", sans-serif;
        }

        main {
            width: 100%;
            display: grid;
            place-items: center;
        }

        .scene-shell {
            width: var(--scene-w);
            display: grid;
            gap: 16px;
        }

        .hero-demo-block {
            display: grid;
            gap: 4px;
        }

        .hero-demo-frame {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            border-radius: 12px;
            background-color: rgba(71, 85, 105, 0.2);
            background-repeat: no-repeat;
            background-size: 700px auto;
            background-position-x: center;
            box-shadow: var(--scene-shadow);
        }

        .hero-demo-lens {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            overflow: hidden;
            border-radius: 100px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 16px 31px rgba(0, 0, 0, 0.4);
        }

        .hero-credit {
            margin-right: 6px;
            margin-top: 2px;
            text-align: right;
        }

        .hero-credit a {
            color: #64748b;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            text-decoration: none;
        }

        .hero-credit a:hover {
            color: #334155;
        }

        .hero-demo-copy {
            margin: 2px 6px 0 0;
            text-align: right;
            color: #64748b;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .hero-demo-frame--card {
            background: linear-gradient(180deg, #f4f7fb 0%, #dde7f5 100%);
        }

        .hero-card-base {
            position: absolute;
            inset: 0;
        }

        .hero-card-stage {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            padding: 28px;
            background:
                radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.92), transparent 24%),
                radial-gradient(circle at 82% 22%, rgba(255, 255, 255, 0.64), transparent 20%),
                linear-gradient(135deg, rgba(84, 125, 201, 0.16), transparent 36%),
                linear-gradient(180deg, #f7f9fc 0%, #e4edf8 100%);
        }

        .hero-card-stage--lens {
            width: 676px;
            height: 400px;
            transform: translate(-238px, -100px);
            transform-origin: top left;
        }

        .hero-card-snapshot {
            display: block;
            width: 338px;
            height: 359px;
        }

        .hero-text-card {
            width: min(100%, 338px);
            padding: 22px 24px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 18px 36px rgba(62, 86, 128, 0.16);
            color: #182230;
        }

        .hero-text-card.is-active {
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 22px 42px rgba(62, 86, 128, 0.22);
        }

        .hero-text-kicker {
            display: inline-flex;
            margin-bottom: 10px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(103, 132, 187, 0.12);
            color: #4c628a;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .hero-text-title {
            margin: 0;
            font-size: 29px;
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        .hero-text-copy {
            margin: 12px 0 0;
            color: rgba(24, 34, 48, 0.76);
            font-size: 14px;
            line-height: 1.5;
        }

        .hero-text-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }

        .hero-text-action {
            appearance: none;
            border: 0;
            padding: 10px 14px;
            border-radius: 999px;
            background: #2d5baf;
            color: #f8fbff;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 18px rgba(45, 91, 175, 0.24);
        }

        .hero-text-action:hover {
            background: #244c96;
        }

        .hero-text-status {
            color: rgba(24, 34, 48, 0.58);
            font-size: 12px;
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body>
    <main>
        <section class="scene-shell" aria-label="Liquid glass hero demo">
            <section class="hero-demo-block" aria-label="Liquid glass hero demo">
                <div class="hero-demo-frame" id="hero-demo-frame">
                    <svg class="hero-demo-lens" id="hero-demo-lens" viewBox="0 0 150 150"
                        preserveAspectRatio="xMidYMid slice" color-interpolation-filters="sRGB"
                        aria-hidden="true"></svg>
                </div>
                <div class="hero-credit">
                    <a href="https://unsplash.com/photos/a-black-and-pink-abstract-background-with-curves-wRuhOOaG-Z4"
                        target="_blank" rel="noopener noreferrer">Photo by Martin Martz on Unsplash</a>
                </div>
            </section>

            <section class="hero-demo-block" aria-label="Liquid glass hero demo with image mock">
                <div class="hero-demo-frame hero-demo-frame--card" id="hero-demo-mock-frame">
                    <div class="hero-card-base hero-card-stage" id="hero-demo-mock-base"></div>
                    <svg class="hero-demo-lens" id="hero-demo-mock-lens" viewBox="0 0 200 200"
                        preserveAspectRatio="xMidYMid slice" color-interpolation-filters="sRGB"
                        aria-hidden="true"></svg>
                </div>
                <p class="hero-demo-copy">Image-backed mock built from a screenshot of the HTML card</p>
            </section>

            <section class="hero-demo-block" aria-label="Liquid glass hero demo with live HTML content">
                <div class="hero-demo-frame hero-demo-frame--card" id="hero-demo-html-retry-frame">
                    <div class="hero-card-base hero-card-stage" id="hero-demo-html-base"></div>
                    <svg class="hero-demo-lens" id="hero-demo-html-lens" viewBox="0 0 200 200"
                        preserveAspectRatio="xMidYMid slice" color-interpolation-filters="sRGB"
                        aria-hidden="true"></svg>
                </div>
                <p class="hero-demo-copy">HTML-only retry aligned against the screenshot mock</p>
            </section>
        </section>
    </main>

    <script>
        const heroFrame = document.getElementById("hero-demo-frame");
        const heroMockFrame = document.getElementById("hero-demo-mock-frame");
        const heroMockBase = document.getElementById("hero-demo-mock-base");
        const heroHtmlFrame = document.getElementById("hero-demo-html-retry-frame");
        const heroHtmlBase = document.getElementById("hero-demo-html-base");
        let heroHtmlActivated = false;
        const heroBackgroundURL = new URL("./hero-background.jpg", window.location.href).href;
        const heroLensURL = new URL("./hero-lens.jpg", window.location.href).href;
        const heroDisplacementMapURL = new URL("./hero-displacement-map.png", window.location.href).href;
        const heroSpecularMapURL = new URL("./hero-specular-map.png", window.location.href).href;

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        const heroCardSnapshotWidth = 338;
        const heroCardSnapshotHeight = 359;
        const heroCardSceneWidth = 676;
        const heroCardSceneHeight = 400;
        const heroCardLensSize = 200;
        const heroCardSceneX = (heroCardSceneWidth - heroCardSnapshotWidth) / 2;
        const heroCardSceneY = (heroCardSceneHeight - heroCardSnapshotHeight) / 2;
        const heroCardLensX = (heroCardSceneWidth - heroCardLensSize) / 2;
        const heroCardLensY = (heroCardSceneHeight - heroCardLensSize) / 2;
        const heroCardLensImageX = heroCardSceneX - heroCardLensX;
        const heroCardLensImageY = heroCardSceneY - heroCardLensY;
        const heroCardSnapshotAssetURL = new URL("./hero-card-screenshot.png", window.location.href).href;

        function heroParallaxFromRectTop(rectTop) {
            return {
                backgroundY: clamp(rectTop * 0.25 - 195.75, -260, -60),
                lensY: clamp(rectTop * 0.1875 - 88.8125, -137, 13)
            };
        }

        function heroCardParallaxOffset(rectTop) {
            const centeredTop = window.innerHeight * 0.5 - heroCardSceneHeight * 0.5;
            const centeredLensY = heroParallaxFromRectTop(centeredTop).lensY;
            const currentLensY = heroParallaxFromRectTop(rectTop).lensY;

            return clamp((currentLensY - centeredLensY) * 0.24, -18, 18);
        }

        function heroFilterMarkup(filterId, size = 150) {
            const scale = 133.9733637691058 * (size / 150);
            return `
                    <filter id="${filterId}" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
                        <feGaussianBlur in="SourceGraphic" stdDeviation="0.2" result="blurred_source"></feGaussianBlur>
                        <feImage href="${heroDisplacementMapURL}" x="0" y="0" width="${size}" height="${size}" result="displacement_map"></feImage>
                        <feDisplacementMap in="blurred_source" in2="displacement_map" scale="${scale}" xChannelSelector="R" yChannelSelector="G" result="displaced"></feDisplacementMap>
                        <feColorMatrix in="displaced" type="saturate" values="6" result="displaced_saturated"></feColorMatrix>
                        <feImage href="${heroSpecularMapURL}" x="0" y="0" width="${size}" height="${size}" result="specular_layer"></feImage>
                        <feComposite in="displaced_saturated" in2="specular_layer" operator="in" result="specular_saturated"></feComposite>
                        <feComponentTransfer in="specular_layer" result="specular_faded">
                            <feFuncA type="linear" slope="0.2"></feFuncA>
                        </feComponentTransfer>
                        <feBlend in="specular_saturated" in2="displaced" mode="normal" result="with_saturation"></feBlend>
                        <feBlend in="specular_faded" in2="with_saturation" mode="normal"></feBlend>
                    </filter>`;
        }

        function heroLensShellMarkup(lensId, filterId, size, contentMarkup) {
            return `
                <svg class="hero-demo-lens" id="${lensId}" viewBox="0 0 ${size} ${size}" preserveAspectRatio="xMidYMid slice" color-interpolation-filters="sRGB" aria-hidden="true">
                    <defs>
                        ${heroFilterMarkup(filterId, size)}
                    </defs>
                    <g filter="url(#${filterId})">
                        ${contentMarkup}
                    </g>
                </svg>`;
        }

        function heroLensMarkup() {
            return `
                ${heroLensShellMarkup("hero-demo-lens", "hero-demo-filter", 150, `
                        <foreignObject x="0" y="0" width="150" height="150">
                            <div xmlns="http://www.w3.org/1999/xhtml" style="width:150px;height:150px;overflow:hidden;border-radius:75px;">
                                <div id="hero-demo-foreign-image" style="width:200px;height:350px;background-image:url('${heroLensURL}');background-repeat:no-repeat;background-size:200px auto;transform:translateX(-29px) translateY(13px);transform-origin:50% 50%;"></div>
                            </div>
                        </foreignObject>`)}
            `;
        }

        function heroTextCardMarkup(cardId = "") {
            const statusText = heroHtmlActivated ? "Button click reached the live HTML node." : "The button below is ordinary HTML inside the foreignObject.";
            const buttonLabel = heroHtmlActivated ? "Activated" : "Press me";
            const cardClassName = heroHtmlActivated ? "hero-text-card is-active" : "hero-text-card";
            const cardIdAttribute = cardId ? ` id="${cardId}"` : "";
            return `
                <article${cardIdAttribute} class="${cardClassName}">
                    <div class="hero-text-kicker">HTML Backdrop</div>
                    <h2 class="hero-text-title">Liquid glass can bend live text too.</h2>
                    <p class="hero-text-copy">This live version reuses the same layout as the screenshot mock, but keeps the card as ordinary HTML underneath the glass lens.</p>
                    <p class="hero-text-copy">The button stays interactive in the base scene while the lens is rendered from an HTML-only foreignObject overlay above it.</p>
                    <div class="hero-text-actions">
                        <button class="hero-text-action" type="button" data-hero-html-toggle="true">${buttonLabel}</button>
                        <div class="hero-text-status" aria-live="polite">${statusText}</div>
                    </div>
                </article>`;
        }

        function heroCardBaseMarkup(html = false) {
            return html
                ? heroTextCardMarkup("hero-demo-html-card")
                : `<img class="hero-card-snapshot" id="hero-demo-mock-snapshot" src="${heroCardSnapshotAssetURL}" alt="Screenshot of the HTML card" width="${heroCardSnapshotWidth}" height="${heroCardSnapshotHeight}">`;
        }

        function heroCardLensMarkup(html = false) {
            return heroLensShellMarkup(
                html ? "hero-demo-html-lens" : "hero-demo-mock-lens",
                html ? "hero-demo-html-filter" : "hero-demo-mock-filter",
                heroCardLensSize,
                html
                    ? `
                        <foreignObject x="0" y="0" width="${heroCardLensSize}" height="${heroCardLensSize}">
                            <div xmlns="http://www.w3.org/1999/xhtml" style="width:${heroCardLensSize}px;height:${heroCardLensSize}px;overflow:hidden;border-radius:${heroCardLensSize / 2}px;">
                                <div class="hero-card-stage hero-card-stage--lens" id="hero-demo-html-lens-stage">
                                    ${heroTextCardMarkup()}
                                </div>
                            </div>
                        </foreignObject>`
                    : `<image id="hero-demo-mock-lens-image" href="${heroCardSnapshotAssetURL}" x="${heroCardLensImageX}" y="${heroCardLensImageY}" width="${heroCardSnapshotWidth}" height="${heroCardSnapshotHeight}" preserveAspectRatio="none"></image>`
            );
        }

        function renderCardSample(base, lensId, html = false) {
            if (base) {
                base.innerHTML = heroCardBaseMarkup(html);
            }

            const lens = document.getElementById(lensId);
            if (lens) {
                lens.outerHTML = heroCardLensMarkup(html);
            }
        }

        function renderCardSamples() {
            renderCardSample(heroMockBase, "hero-demo-mock-lens");
            renderCardSample(heroHtmlBase, "hero-demo-html-lens", true);
        }

        function updateCardSample(frame, baseId, lensId, html = false) {
            if (!frame) {
                return;
            }

            const offsetY = heroCardParallaxOffset(frame.getBoundingClientRect().top);
            const base = document.getElementById(baseId);
            if (base) {
                base.style.transform = `translateY(${offsetY}px)`;
            }

            const lens = document.getElementById(lensId);
            if (!lens) {
                return;
            }

            if (html) {
                lens.style.transform = `translate(${-heroCardLensX}px, ${-heroCardLensY + offsetY}px)`;
                return;
            }

            lens.setAttribute("y", `${heroCardLensImageY + offsetY}`);
        }

        function updateHeroDemo() {
            if (!heroFrame) {
                return;
            }

            const { top } = heroFrame.getBoundingClientRect();
            const { backgroundY, lensY } = heroParallaxFromRectTop(top);
            heroFrame.style.backgroundImage = `url(${heroBackgroundURL})`;
            heroFrame.style.backgroundPositionY = `${backgroundY}px`;

            const foreignImage = document.getElementById("hero-demo-foreign-image");
            if (foreignImage) {
                foreignImage.style.transform = `translateX(-29px) translateY(${lensY}px)`;
            }

            updateCardSample(heroMockFrame, "hero-demo-mock-snapshot", "hero-demo-mock-lens-image");
            updateCardSample(heroHtmlFrame, "hero-demo-html-card", "hero-demo-html-lens-stage", true);
        }

        function renderScene() {
            const heroLens = document.getElementById("hero-demo-lens");
            if (heroLens) {
                heroLens.outerHTML = heroLensMarkup();
            }

            renderCardSamples();
            updateHeroDemo();
        }

        renderScene();
        document.addEventListener("click", (event) => {
            const toggleButton = event.target.closest("[data-hero-html-toggle]");
            if (!toggleButton) {
                return;
            }

            heroHtmlActivated = !heroHtmlActivated;
            renderCardSamples();
            updateHeroDemo();
        });
        window.addEventListener("resize", renderScene, { passive: true });
        window.addEventListener("scroll", updateHeroDemo, { passive: true });
    </script>
</body>

</html>
